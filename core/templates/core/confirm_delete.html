{% extends "base.html" %}
{% block title %}Delete {{ singular }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h1 class="h5 text-danger"><i class="bi bi-exclamation-triangle"></i> Delete {{ singular|lower }}?</h1>
        <p class="mb-4">You are about to delete <strong>{{ object }}</strong>. This cannot be undone.</p>
        <form method="post" class="d-flex gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
